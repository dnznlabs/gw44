# What a push must pass: the whole-tree secret scan, the typechecks and unit tests, then the browser
# suite in all three engines. Offline by design — nothing here reaches a live chain (m01-t03).
name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 0.22.0, not the 0.18.0 of devbox.json's $schema: the committed devbox.lock was written by
      # 0.22.0 and records `plugin_version: 0.0.6`, where 0.18.0 rewrites it to 0.0.4 and trips the
      # working-tree check at the end. Re-locking under 0.18.0 would only move the problem, since
      # the next local `devbox` run writes 0.0.6 back.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          devbox-version: 0.22.0
          enable-cache: true

      # The pre-commit `betterleaks` hook scans the staged diff, which is empty here; the
      # `betterleaks-tree` alias scans the directory. A pass on nothing is the failure mode worth
      # guarding, so the byte count has to look like a real tree. The log goes outside the
      # repository: a stray file would trip the working-tree check at the end.
      - name: Secret scan, whole tree
        shell: bash
        run: |
          set -eo pipefail
          devbox run -- pre-commit run betterleaks-tree --hook-stage manual --all-files --verbose \
            2>&1 | tee "$RUNNER_TEMP/scan.log"
          grep -Eq 'scanned ~[1-9][0-9]{5,} bytes' "$RUNNER_TEMP/scan.log"

      - name: Install dependencies
        run: devbox run -- npm ci

      # --with-deps brings the system libraries Firefox and WebKit need; they are what the
      # development VM lacks. Chromium ships as a headless shell under its own package name.
      - name: Install browsers
        run: devbox run -- npx playwright-core install --with-deps chromium-headless-shell firefox webkit

      - name: Typecheck and unit tests
        env:
          # The decoder fuzz defaults to 20,000 so `make test` stays quick for a contributor; CI is
          # where the million runs. A non-integer value fails the test rather than falling back.
          GW44_FUZZ_RUNS: "1000000"
        run: devbox run -- make test

      # The build is reproducible or it is not a build anyone can check: two outputs from one commit
      # must be identical, and the hashes in this log are what a reader compares a local build
      # against. `npm ls --omit=dev --parseable` printing only the root line is the no-runtime-
      # dependency claim, checked rather than asserted.
      - name: The build is reproducible, and has no runtime dependencies
        shell: bash
        run: |
          set -eo pipefail
          # Outside the checkout on purpose: two build directories inside it would be untracked
          # files, and the working-tree check at the end of this job would fail on them.
          a="$RUNNER_TEMP/dist-a"
          b="$RUNNER_TEMP/dist-b"
          devbox run -- bash -c "GW44_OUT='$a' node tools/build.ts && GW44_OUT='$b' node tools/build.ts"
          diff -r "$a" "$b"
          # The pinned build is a second deployable with its own bytes, so it gets its own pair.
          pin=11155111:0x00a9f390a6010d045e0d34856048ddd6910d25ba
          pa="$RUNNER_TEMP/pinned-a"
          pb="$RUNNER_TEMP/pinned-b"
          devbox run -- bash -c "GW44_PIN='$pin' GW44_OUT='$pa' node tools/build.ts && GW44_PIN='$pin' GW44_OUT='$pb' node tools/build.ts"
          diff -r "$pa" "$pb"
          deps=$(devbox run -- npm ls --omit=dev --parseable | wc -l)
          if [ "$deps" -ne 1 ]; then
            echo "npm ls --omit=dev printed $deps lines; the deployable must have no runtime dependencies:"
            devbox run -- npm ls --omit=dev --parseable
            exit 1
          fi

      - name: Browser tests, three engines
        run: devbox run -- make e2e ENGINES="chromium firefox webkit"

      # Last, so it catches anything the build or the tests wrote into a tracked path.
      - name: The working tree is unchanged
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build or the tests modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi
