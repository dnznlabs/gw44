# What a push must pass: the whole-tree secret scan, the typechecks and unit tests, then the browser
# suite in all three engines. Offline by design — nothing here reaches a live chain (m01-t03).
name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          devbox-version: 0.18.0
          enable-cache: true

      # The pre-commit `betterleaks` hook scans the staged diff, which is empty here; the
      # `betterleaks-tree` alias scans the directory. A pass on nothing is the failure mode worth
      # guarding, so the byte count has to look like a real tree. The log goes outside the
      # repository: a stray file would trip the working-tree check at the end.
      - name: Secret scan, whole tree
        shell: bash
        run: |
          set -eo pipefail
          devbox run -- pre-commit run betterleaks-tree --hook-stage manual --all-files --verbose \
            2>&1 | tee "$RUNNER_TEMP/scan.log"
          grep -Eq 'scanned ~[1-9][0-9]{5,} bytes' "$RUNNER_TEMP/scan.log"

      - name: Install dependencies
        run: devbox run -- npm ci

      # --with-deps brings the system libraries Firefox and WebKit need; they are what the
      # development VM lacks. Chromium ships as a headless shell under its own package name.
      - name: Install browsers
        run: devbox run -- npx playwright-core install --with-deps chromium-headless-shell firefox webkit

      - name: Typecheck and unit tests
        run: devbox run -- make test

      # TEMPORARY (m01-t01 step 6): the first run installed the apt packages successfully and then
      # failed to launch Firefox and WebKit from inside devbox, naming the same libraries as
      # missing. This prints what the launcher actually sees, so the fix is chosen on evidence.
      - name: Diagnose the library view inside and outside devbox
        shell: bash
        run: |
          FF="$HOME/.cache/ms-playwright/firefox-1572/firefox/firefox"
          echo "--- outside devbox ---"
          echo "LD_LIBRARY_PATH=[${LD_LIBRARY_PATH:-}]"
          echo "ldconfig hits: $(ldconfig -p | grep -cE 'libasound[.]so[.]2|libgtk-3[.]so[.]0' || true)"
          echo "ldd not-found: $(ldd "$FF" 2>&1 | grep -c 'not found' || true)"
          echo "--- inside devbox ---"
          devbox run -- bash -c 'echo "LD_LIBRARY_PATH=[$LD_LIBRARY_PATH]"; echo "ldd is $(command -v ldd)"; echo "ldd not-found: $(ldd '"$FF"' 2>&1 | grep -c "not found" || true)"'

      - name: Browser tests, three engines
        env:
          # The apt packages install fine; it is devbox's view of them that fails Playwright's
          # pre-launch host check. Skipping the check tests whether the browsers themselves run.
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
        run: devbox run -- make e2e ENGINES="chromium firefox webkit"

      # Last, so it catches anything the build or the tests wrote into a tracked path.
      - name: The working tree is unchanged
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build or the tests modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi
