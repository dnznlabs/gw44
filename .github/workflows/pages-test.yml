# Deploys the test site at gw-test.dnzn.dev by calling the reusable workflow, exactly as a project
# in another repository would. It is this repository's own first caller, so the path a project takes
# is the path that is exercised here.
#
# Run by hand, from `main`, and only there. Not on push, not on a schedule, not from a branch
# (m02-t01 § Out of scope): a deploy is a decision, and the site it replaces is what the next
# milestone's checks are measured against.
#
# `gw44-read-key` is passed although this repository's own token could read it: the secret is the
# path a caller elsewhere depends on, and a path nobody exercises is a path nobody knows works.
name: pages-test

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # A local path, so the workflow and the source are the same commit by construction. A caller in
    # another repository writes `dnznlabs/gw44/.github/workflows/deploy-pages.yml@<sha>` instead and
    # repeats that sha in `gw44-ref`.
    uses: ./.github/workflows/deploy-pages.yml
    with:
      gw44-ref: ${{ github.sha }}
      config: test/fixtures/gw44.two-chains.json
      chains: chains.json
      embeds: widget.js
    secrets:
      gw44-read-key: ${{ secrets.GW44_READ_KEY }}
