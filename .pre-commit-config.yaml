default_install_hook_types: [pre-commit, post-commit]

# Nothing that rewrites files: auto-fixing hooks stash mid-commit and collide
# with the index.lock `git commit` already holds.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks
        stages: [pre-commit]
      # The hook above scans the staged diff, which under --all-files is empty. CI needs the whole
      # tree, so this second one scans the directory instead. Manual stage: it is not a commit gate.
      - id: betterleaks
        alias: betterleaks-tree
        entry: betterleaks dir . --redact --verbose
        pass_filenames: false
        stages: [manual]

  # `stages` and `always_run` are both load-bearing on these two.
  - repo: local
    hooks:
      - id: custom-pre-commit-script
        name: Custom Pre Commit Script
        language: unsupported_script
        entry: ./scripts/pre-commit.sh
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: custom-post-commit-script
        name: Custom Post Commit Script
        language: unsupported_script
        entry: ./scripts/post-commit.sh
        pass_filenames: false
        always_run: true
        stages: [post-commit]
